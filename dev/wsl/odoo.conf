[options]
; Argentina CE 19 — Odoo 19 CE local (WSL). Do not add cajaone_* addons.
admin_passwd = arce19_dev_master
; Use TCP localhost so password auth works (peer auth fails as root→odoo).
db_host = 127.0.0.1
db_port = 5432
db_user = odoo
db_password = odoo
http_interface = 0.0.0.0
http_port = 8079
list_db = True
proxy_mode = False
without_demo = False
workers = 0
max_cron_threads = 1

addons_path = /root/src/odoo19/addons,/mnt/c/Users/Matias/Desktop/github/odoo-argentina-ce-fork
data_dir = /root/.local/share/Odoo-arce19

; Useful while developing custom modules
dev_mode = reload
log_level = info
